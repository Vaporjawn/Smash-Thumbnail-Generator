name: Deploy to GitHub Pages

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: gh-pages-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        # See .github/workflows/ci.yml for why --legacy-peer-deps is needed.
        run: npm ci --legacy-peer-deps

      - name: Build
        run: npm run build
        env:
          # See .github/workflows/ci.yml for why this is required (webpack 4
          # + terser-webpack-plugin vs. Node's OpenSSL 3 default).
          NODE_OPTIONS: --openssl-legacy-provider

      - name: Deploy to gh-pages
        # Pinned to a commit SHA (not the mutable v3 tag) for supply-chain
        # safety, since this step runs with contents: write and pushes to
        # the repo. SHA corresponds to tag v3.9.3.
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4.1.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
